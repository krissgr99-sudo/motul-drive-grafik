<!DOCTYPE html>
<html lang="ru" data-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>MOTUL-DRIVE · Закулисье</title>
<script>
try{localStorage.removeItem("md_cash_key");document.documentElement.dataset.theme=localStorage.getItem("md_theme")==="dark"?"dark":"light"}catch(e){}
try{history.replaceState(null,"",location.pathname)}catch(e){location.hash=""}
</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--font-disp:'Space Grotesk',system-ui,sans-serif;--font-text:'Manrope',system-ui,sans-serif;--brand:#d11f2d;--brand-hover:#e6232f}
[data-theme=light]{--bg:#eef0f3;--card:#fff;--line:#e6e8ec;--text:#1f2430;--muted:#646b78;--shadow:0 8px 24px rgba(20,25,40,.06)}
[data-theme=dark]{--bg:#0a0b0e;--card:#13151b;--line:rgba(255,255,255,.08);--text:#f1f3f6;--muted:#8a909c;--shadow:0 16px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:14px/1.6 var(--font-text)}
main{max-width:440px;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
small{color:var(--muted)}h1{font:700 23px var(--font-disp);margin:12px 0}p{color:var(--muted)}a{display:block;padding:14px;margin-top:20px;border-radius:12px;text-align:center;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;min-height:44px}a:hover{background:var(--brand-hover)}a:active{transform:scale(.95)}a:focus-visible{outline:2px solid var(--text);outline-offset:4px}a[hidden]{display:none}
</style></head><body><main>
<small>MOTUL-DRIVE</small><h1>Закулисье</h1>
<p id="status">Вход через ваш Google-аккаунт. Прежний ключ больше не нужен.</p>
<a id="enter" href="https://script.google.com/macros/s/AKfycbytKc5QrbkndxD7chFtags8qh64mBFjyubgAtCEWEcR5VlZi-WpIOVsWXig7B6Ff8T_/exec" rel="noreferrer" hidden>Войти через Google</a>
<p>Если открылся другой аккаунт, используйте отдельный профиль или приватное окно браузера.</p>
</main><script>
var entry=document.getElementById("enter");
if(/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(entry.getAttribute("href"))) entry.hidden=false;
else document.getElementById("status").textContent="Новый вход ещё не опубликован.";
</script></body></html>
