# Конфиг gitleaks для deploy-репозитория (GitHub Pages, публичный).
# Задача: ловить СЛУЧАЙНО попавшие секреты (ключи API, приватные ключи, токены),
# но НЕ ругаться на осознанно-публичные значения статического клиента.
#
# Наследуем все встроенные правила gitleaks:
[extend]
useDefault = true

# --- Осознанно-публичные значения (не секреты по архитектуре) ---
#
# Сайт — статический HTML на GitHub Pages, серверной части нет. Запись в
# Google-таблицу идёт напрямую из браузера в Apps Script, поэтому клиентский
# write-токен SHEET_TOKEN физически уходит в публичный index.html. Это принятый
# риск (см. memory/motul-drive-security-review.md), а не утечка. Исключаем
# ровно строку присваивания SHEET_TOKEN — при ротации токена правило продолжит
# работать, а любой ДРУГОЙ секрет в файле по-прежнему будет пойман.
[[allowlists]]
description = "Клиентский write-токен Apps Script (SHEET_TOKEN) — публичен по архитектуре статики"
regexTarget = "line"
regexes = [
  '''SHEET_TOKEN\s*=\s*"[^"]*"''',
]

# Ключи записей каталога ТО (TO_OILS: moto_xcess_5w40 и т.п.) — идентификаторы
# строк данных в открытом прайсе, не секреты. generic-api-key ловит шаблон
# key:"...", исключаем ровно moto_-префикс каталога масел.
[[allowlists]]
description = "Идентификаторы каталога моторных масел ТО (key:\"moto_*\") — данные, не секреты"
regexTarget = "line"
regexes = [
  '''key:"moto_[a-z0-9_]+"''',
]
