name: Обновить продажи (LiveSklad)

# Робот раз в день считает продажи промывки из LiveSklad и обновляет sales.json.
on:
  schedule:
    - cron: "23 17 * * *"  # 17:23 UTC = 20:23 по Москве (тихая минута — стабильнее, чем :00)
  workflow_dispatch: {}     # можно запустить вручную кнопкой в разделе Actions

permissions:
  contents: write           # чтобы робот мог закоммитить обновлённый sales.json

concurrency:
  group: sales-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
      DAYS: "2"
      LIVESKLAD_LOGIN: ${{ secrets.LIVESKLAD_LOGIN }}
      LIVESKLAD_PASSWORD: ${{ secrets.LIVESKLAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Собрать продажи
        run: node build-sales.js

      - name: Закоммитить, если изменилось
        run: |
          git config user.name "sales-bot"
          git config user.email "sales-bot@users.noreply.github.com"
          git add sales.json
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "Продажи: автообновление за $(date +%F)"
            git push
          fi
