name: Отметить вывод (копилка)

# Кнопка «Отметить вывод» на сайте открывает issue с маркером md-withdraw-v1.
# По такому issue от владельца репозитория робот считает текущую копилку и
# дописывает вывод в withdrawals.json (продажи − прошлые выводы, «под ноль»).
on:
  issues:
    types: [opened]

permissions:
  contents: write        # закоммитить обновлённый withdrawals.json
  issues: write          # ответить в issue и закрыть его

concurrency:
  group: withdraw
  cancel-in-progress: false

jobs:
  record:
    # только владелец репо и только «наш» issue (маркер в теле) — защита от чужих записей
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, 'md-withdraw-v1')
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Записать вывод
        id: rec
        run: |
          node record-withdrawal.js | tee out.log
          echo "msg=$(tail -n 1 out.log)" >> "$GITHUB_OUTPUT"

      - name: Закоммитить, если изменилось
        run: |
          git config user.name "sales-bot"
          git config user.email "sales-bot@users.noreply.github.com"
          git add withdrawals.json
          if git diff --cached --quiet; then
            echo "Изменений нет — копилка была пуста."
          else
            git commit -m "Копилка: вывод за $(date +%F)"
            git push
          fi

      - name: Ответить в issue и закрыть
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "🤖 ${{ steps.rec.outputs.msg }}"
          gh issue close "${{ github.event.issue.number }}"
